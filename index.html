<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civ Sim — Island Landscape</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #1a2029;
    --panel-border: #2a3341;
    --text: #d7dee8;
    --text-dim: #8a97a8;
    --accent: #4fa3d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
  header .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  label { font-size: 13px; color: var(--text-dim); }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 8px;
    width: 130px;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    border: none;
    color: #08131b;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-weight: 400;
  }
  select {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
  }
  main { display: flex; flex: 1; min-height: 0; }
  #map-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0;
  }
  canvas {
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
    border: 1px solid var(--panel-border);
    cursor: crosshair;
    touch-action: none;
  }
  canvas.zoomed { cursor: grab; }
  canvas.panning { cursor: grabbing; }
  .zoom-controls { display: flex; align-items: center; gap: 6px; }
  button.icon {
    width: 28px;
    padding: 6px 0;
    font-size: 15px;
    line-height: 1;
  }
  #zoom-level {
    font-size: 13px;
    color: var(--text-dim);
    min-width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  aside {
    width: 260px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 14px;
    overflow-y: auto;
    font-size: 13px;
    flex-shrink: 0;
  }
  aside h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  aside h2:first-child { margin-top: 0; }
  .legend-row, .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .stat-row { justify-content: space-between; }
  .stat-row .value { color: var(--text-dim); }
  #tile-info {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 8px 10px;
    min-height: 84px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  #tile-info strong { color: var(--text); }
  .ramp-bar {
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
    margin: 4px 0 2px;
  }
  .ramp-labels {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
  }
  .tribe-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
  }
  .tribe-row .tribe-meta {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 12px;
    text-align: right;
    white-space: nowrap;
  }
  .tribe-row.dead { opacity: 0.45; text-decoration: line-through; }
  #events-log {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 8px 10px;
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.45;
    font-size: 12px;
    color: var(--text-dim);
  }
  #events-log .ev-year { color: var(--accent); font-weight: 600; }
  .toggle-row { cursor: pointer; user-select: none; }
  .toggle-row input { accent-color: var(--accent); margin-right: 2px; }
  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 8px;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-weight: 500;
    padding: 6px 0;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #08131b;
    font-weight: 600;
  }
  .params-note {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .param-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .param-row label { flex: 1; font-size: 12px; color: var(--text); }
  .param-row label .hint { display: block; color: var(--text-dim); font-size: 11px; }
  .param-row input {
    width: 74px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    text-align: right;
  }
  .param-row input.changed { border-color: var(--accent); }
  #params-reset { margin-top: 12px; width: 100%; }
  .tribe-row { cursor: pointer; border-radius: 4px; padding-left: 4px; }
  .tribe-row:hover { background: rgba(255,255,255,0.05); }
  .tribe-row.selected { background: rgba(79,163,209,0.15); }
  .tribe-row .badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  #tribe-inspector {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 10px;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.5;
  }
  #tribe-inspector h3 { font-size: 13px; margin-bottom: 2px; }
  #tribe-inspector .insp-sub { color: var(--text-dim); margin-bottom: 6px; }
  .trait-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .trait-row .trait-name { width: 92px; color: var(--text-dim); font-size: 11px; }
  .trait-bar {
    flex: 1;
    height: 6px;
    background: var(--panel-border);
    border-radius: 3px;
    overflow: hidden;
  }
  .trait-bar > div { height: 100%; border-radius: 3px; }
  .posture-row {
    display: flex;
    gap: 6px;
    margin: 6px 0;
  }
  .posture-row span {
    flex: 1;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 3px 0;
    font-size: 11px;
    color: var(--text-dim);
  }
  #tribe-inspector .insp-section { margin-top: 6px; color: var(--text-dim); }
  #tribe-inspector .insp-section strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Civ Sim</h1>
  <div class="controls">
    <label for="seed-input">Seed</label>
    <input type="text" id="seed-input" spellcheck="false">
    <button id="generate-btn">Generate</button>
    <button id="random-btn" class="secondary">Random</button>
    <button id="simulate-btn">Found tribes &amp; simulate 10 years</button>
    <label for="view-select">View</label>
    <select id="view-select">
      <option value="satellite">Satellite</option>
      <option value="communities">Communities</option>
      <option value="development">Development</option>
      <option value="trade">Trade</option>
      <option value="elevation">Elevation</option>
      <option value="rainfall">Avg rainfall</option>
      <option value="temperature">Avg temperature</option>
      <option value="natural">Natural resources</option>
      <option value="minerals">Mineral resources</option>
    </select>
    <span class="zoom-controls">
      <button id="zoom-out-btn" class="secondary icon" title="Zoom out">−</button>
      <span id="zoom-level">1.0×</span>
      <button id="zoom-in-btn" class="secondary icon" title="Zoom in">+</button>
      <button id="zoom-reset-btn" class="secondary" title="Reset view">Reset</button>
    </span>
  </div>
</header>
<main>
  <div id="map-container">
    <canvas id="map-canvas"></canvas>
  </div>
  <aside>
    <div class="tab-bar">
      <button id="tab-btn-world" class="tab active">World</button>
      <button id="tab-btn-params" class="tab">Parameters</button>
    </div>
    <div id="tab-world">
    <h2>Inspect</h2>
    <div id="tile-info">Hover over the map to inspect a tile.</div>
    <div id="tribes-section" style="display: none">
      <h2>Tribes</h2>
      <div id="tribes-panel"></div>
      <div id="tribe-inspector" style="display: none"></div>
      <h2>Chronicle</h2>
      <div id="events-log"></div>
    </div>
    <h2 id="legend-a-title">Terrain</h2>
    <div id="terrain-legend"></div>
    <h2 id="legend-b-title">Resources</h2>
    <div id="resource-legend"></div>
    <h2>Statistics</h2>
    <div id="stats"></div>
    </div>
    <div id="tab-params" style="display: none">
      <div class="params-note">Values apply as the simulation continues.
        Entries marked ⟳ take effect when a new world is generated.</div>
      <div id="params-panel"></div>
      <button id="params-reset" class="secondary">Reset to defaults</button>
    </div>
  </aside>
</main>
<script src="js/rng.js"></script>
<script src="js/noise.js"></script>
<script src="js/terrain.js"></script>
<script src="js/rivers.js"></script>
<script src="js/resources.js"></script>
<script src="js/params.js"></script>
<script src="js/world.js"></script>
<script src="js/geography.js"></script>
<script src="js/traits.js"></script>
<script src="js/tech.js"></script>
<script src="js/tribes.js"></script>
<script src="js/relations.js"></script>
<script src="js/economy.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
