<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civ Sim — Island Landscape</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #1a2029;
    --panel-border: #2a3341;
    --text: #d7dee8;
    --text-dim: #8a97a8;
    --accent: #4fa3d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
  header .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  label { font-size: 13px; color: var(--text-dim); }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 8px;
    width: 130px;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    border: none;
    color: #08131b;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-weight: 400;
  }
  select {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
  }
  main { display: flex; flex: 1; min-height: 0; }
  #map-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0;
  }
  canvas {
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
    border: 1px solid var(--panel-border);
    cursor: crosshair;
  }
  aside {
    width: 260px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 14px;
    overflow-y: auto;
    font-size: 13px;
    flex-shrink: 0;
  }
  aside h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  aside h2:first-child { margin-top: 0; }
  .legend-row, .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .stat-row { justify-content: space-between; }
  .stat-row .value { color: var(--text-dim); }
  #tile-info {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 8px 10px;
    min-height: 84px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  #tile-info strong { color: var(--text); }
  .ramp-bar {
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
    margin: 4px 0 2px;
  }
  .ramp-labels {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>Civ Sim</h1>
  <div class="controls">
    <label for="seed-input">Seed</label>
    <input type="text" id="seed-input" spellcheck="false">
    <button id="generate-btn">Generate</button>
    <button id="random-btn" class="secondary">Random</button>
    <label for="view-select">View</label>
    <select id="view-select">
      <option value="satellite">Satellite</option>
      <option value="elevation">Elevation</option>
      <option value="rainfall">Avg rainfall</option>
      <option value="temperature">Avg temperature</option>
      <option value="natural">Natural resources</option>
      <option value="minerals">Mineral resources</option>
    </select>
  </div>
</header>
<main>
  <div id="map-container">
    <canvas id="map-canvas"></canvas>
  </div>
  <aside>
    <h2>Inspect</h2>
    <div id="tile-info">Hover over the map to inspect a tile.</div>
    <h2 id="legend-a-title">Terrain</h2>
    <div id="terrain-legend"></div>
    <h2 id="legend-b-title">Resources</h2>
    <div id="resource-legend"></div>
    <h2>Statistics</h2>
    <div id="stats"></div>
  </aside>
</main>
<script src="js/rng.js"></script>
<script src="js/noise.js"></script>
<script src="js/terrain.js"></script>
<script src="js/rivers.js"></script>
<script src="js/resources.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
