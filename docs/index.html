    return;
  }

  const tribeStrength = new Float32Array(size * size); // reused per tribe

  for (const tribe of world.tribes) {
    if (!tribe.alive) continue;
    tribeStrength.fill(0);

    const stamp = (x, y, pop, reach, weight) => {
      const ri = Math.ceil(reach);
      for (let dy = -ri; dy <= ri; dy++) {
        for (let dx = -ri; dx <= ri; dx++) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > reach) continue;
          const ni = ny * size + nx;
          if (isSea(terrain[ni])) continue;
          tribeStrength[ni] += pop * weight * (1 - d / reach);
        }
      }
    };

    for (const s of tribeSettlements(world, tribe.id)) {
      stamp(s.x, s.y, s.pop, gatherRadius(s.pop) * 2.2, 1);
    }
    for (const band of tribeBands(world, tribe.id)) {
      stamp(band.x, band.y, band.pop, 6, 0.4);
    }

    for (let i = 0; i < size * size; i++) {
      const v = tribeStrength[i];
      if (v > 0 && v > strength[i]) {
        strength[i] = v;
        owner[i] = tribe.id;
      }
    }
  }

  // Normalise strength into a display alpha. Log scale: settlements grow
  // to thousands, bands stay at dozens, and both should read on the map.
  for (let i = 0; i < size * size; i++) {
    if (owner[i] >= 0) {
      strength[i] = Math.min(1, Math.log10(1 + strength[i]) / 3.2);
    }
  }

  world.influenceOwner = owner;
  world.influenceStrength = strength;

  for (const tribe of world.tribes) tribe.territoryTiles = 0;
  for (let i = 0; i < size * size; i++) {
    if (owner[i] >= 0) {
      const tribe = world.tribes[owner[i]];
      if (tribe) tribe.territoryTiles++;
    }
  }
}
// ---- js/render.js ----
// Canvas rendering. The world's tiles are painted once into an offscreen
// base layer at native resolution; the visible canvas then shows a
// camera-defined window onto that layer, magnified up to MAX_ZOOM.
// Markers and labels are drawn afterwards in screen space so they stay
// crisp and legible at every zoom level.

const TILE_PX = 3;          // base-layer pixels per tile at 1x
const VIEW_PX = 768;        // logical size of the visible canvas
const MIN_ZOOM = 1;
const MAX_ZOOM = 5;

const TERRAIN_COLORS = {
  [TERRAIN.DEEP_OCEAN]: [16, 42, 74],
  [TERRAIN.OCEAN]: [30, 70, 110],
  [TERRAIN.COAST]: [214, 196, 148],
  [TERRAIN.MARSH]: [104, 130, 90],
  [TERRAIN.PLAINS]: [168, 184, 108],
  [TERRAIN.GRASSLAND]: [120, 160, 84],
  [TERRAIN.FOREST]: [56, 104, 58],
  [TERRAIN.HILLS]: [142, 128, 96],
  [TERRAIN.MOUNTAINS]: [130, 122, 120],
  [TERRAIN.PEAKS]: [235, 235, 240],
  [TERRAIN.LAKE]: [60, 120, 160],
  [TERRAIN.RIVER]: [70, 130, 175],
};

const TERRAIN_LABELS = {
  [TERRAIN.DEEP_OCEAN]: 'Deep ocean',
  [TERRAIN.OCEAN]: 'Ocean',
  [TERRAIN.COAST]: 'Coast',
  [TERRAIN.MARSH]: 'Marsh',
  [TERRAIN.PLAINS]: 'Plains',
  [TERRAIN.GRASSLAND]: 'Grassland',
  [TERRAIN.FOREST]: 'Forest',
  [TERRAIN.HILLS]: 'Hills',
  [TERRAIN.MOUNTAINS]: 'Mountains',
  [TERRAIN.PEAKS]: 'Peaks',
  [TERRAIN.LAKE]: 'Lake',
  [TERRAIN.RIVER]: 'River',
};

// Linear interpolation across a multi-stop color ramp; t in 0..1.
function rampColor(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const seg = t * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(seg));
  const f = seg - i;
  const a = stops[i];
  const b = stops[i + 1];
  return [
    a[0] + (b[0] - a[0]) * f,
    a[1] + (b[1] - a[1]) * f,
    a[2] + (b[2] - a[2]) * f,
  ];
}

// Display ranges for the climate views.
const RAINFALL_RANGE = { min: 400, max: 2800 };   // mm/year
const TEMPERATURE_RANGE = { min: -2, max: 14 };   // °C

const RAINFALL_RAMP = [
  [214, 190, 130],  // dry: parched tan
  [150, 180, 100],  // moderate: green
  [60, 140, 120],   // wet: teal
  [30, 80, 170],    // very wet: deep blue
];

const TEMPERATURE_RAMP = [
  [70, 90, 200],    // cold: blue
  [110, 180, 210],  // cool: cyan
  [220, 215, 120],  // mild: yellow
  [225, 130, 60],   // warm: orange
  [190, 40, 40],    // hot: red
];

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16),
  ];
}

// --- Camera ---------------------------------------------------------------
// The camera is a magnification plus a centre point in tile coordinates.

function createCamera() {
  return { zoom: 1, cx: WORLD_SIZE / 2, cy: WORLD_SIZE / 2 };
}

function clampCamera(world, camera) {
  camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom));
  // Half the visible window, in tiles.
  const half = world.size / camera.zoom / 2;
  camera.cx = Math.max(half, Math.min(world.size - half, camera.cx));
  camera.cy = Math.max(half, Math.min(world.size - half, camera.cy));
  return camera;
}

// Maps between base-layer pixels and canvas pixels for the current camera.
function cameraTransform(world, camera) {
  const worldPx = world.size * TILE_PX;
  const srcSize = worldPx / camera.zoom;
  const srcX = Math.max(0, Math.min(worldPx - srcSize, camera.cx * TILE_PX - srcSize / 2));
  const srcY = Math.max(0, Math.min(worldPx - srcSize, camera.cy * TILE_PX - srcSize / 2));
  return { srcX, srcY, srcSize, scale: VIEW_PX / srcSize };
}

// Canvas pixel -> tile coordinate (fractional).
function screenToTile(world, camera, screenX, screenY) {
  const t = cameraTransform(world, camera);
  return {
    x: (screenX / t.scale + t.srcX) / TILE_PX,
    y: (screenY / t.scale + t.srcY) / TILE_PX,
  };
}

// How many canvas pixels one tile occupies at the current zoom.
function screenPxPerTile(world, camera) {
  return cameraTransform(world, camera).scale * TILE_PX;
}

// --- Base layer -----------------------------------------------------------
// Painting 65k tiles is the expensive part, so the result is cached and
// reused while panning and zooming. Callers pass rebuildBase = true after
// the world or the simulation state changes.

let baseLayer = { canvas: null, key: null };

function invalidateBaseLayer() {
  baseLayer.key = null;
}

function satelliteColor(world, x, y, i) {
  const t = world.terrain[i];
  let [r, g, b] = TERRAIN_COLORS[t] || [255, 0, 255];

  // Hill-shade land by elevation for a bit of relief.
  if (!isWater(t)) {
    const e = world.elevation[i];
    const west = x > 0 ? world.elevation[i - 1] : e;
    const slope = (e - west) * 8;
    const shade = 1 + Math.max(-0.25, Math.min(0.25, slope));
    r *= shade; g *= shade; b *= shade;
  }
  return [r, g, b];
}

function buildBaseLayer(world, view) {
  const { size } = world;
  const worldPx = size * TILE_PX;

  let canvas = baseLayer.canvas;
  if (!canvas || canvas.width !== worldPx) {
    canvas = document.createElement('canvas');
    canvas.width = worldPx;
    canvas.height = worldPx;
    baseLayer.canvas = canvas;
  }
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(worldPx, worldPx);
  const data = img.data;

  const resourceView = view === 'minerals' || view === 'natural';
  const tribeRgb = (world.tribes || []).map((t) => hexToRgb(t.color));

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      let r, g, b;
      const sea = isSea(world.terrain[i]);

      if (view === 'elevation') {
        const e = world.elevation[i];
        if (e < 0.5) {
          // Water depths in blue
          const t = e / 0.5;
          r = 10 + 40 * t; g = 30 + 70 * t; b = 60 + 110 * t;
        } else {
          // Land heights from green to white
          const t = (e - 0.5) / 0.5;
          r = 60 + 175 * t; g = 130 + 105 * t; b = 60 + 175 * t;
        }
      } else if (view === 'rainfall') {
        if (sea) { r = 22; g = 30; b = 44; }
        else {
          const mm = moistureToRainfallMm(world.moisture[i]);
          const t = (mm - RAINFALL_RANGE.min) / (RAINFALL_RANGE.max - RAINFALL_RANGE.min);
          [r, g, b] = rampColor(RAINFALL_RAMP, t);
        }
      } else if (view === 'temperature') {
        if (sea) { r = 22; g = 30; b = 44; }
        else {
          const c = world.temperature[i];
          const t = (c - TEMPERATURE_RANGE.min) / (TEMPERATURE_RANGE.max - TEMPERATURE_RANGE.min);
          [r, g, b] = rampColor(TEMPERATURE_RAMP, t);
        }
      } else if (resourceView) {
        // Desaturated satellite base so the resource markers stand out.
        [r, g, b] = satelliteColor(world, x, y, i);
        const lum = 0.3 * r + 0.59 * g + 0.11 * b;
        const mix = sea ? 0.55 : 0.82; // keep a hint of blue in the sea
        r = r + (lum - r) * mix;
        g = g + (lum - g) * mix;
        b = b + (lum - b) * mix;
        r *= 0.7; g *= 0.7; b *= 0.7;
      } else if (view === 'communities' || view === 'development') {
        // Muted satellite base tinted by whichever tribe holds the tile —
        // tribe colour for Communities, era colour for Development.
        [r, g, b] = satelliteColor(world, x, y, i);
        const lum = 0.3 * r + 0.59 * g + 0.11 * b;
        const mix = sea ? 0.4 : 0.65;
        r = (r + (lum - r) * mix) * 0.8;
        g = (g + (lum - g) * mix) * 0.8;
        b = (b + (lum - b) * mix) * 0.8;

        const ownerId = world.influenceOwner ? world.influenceOwner[i] : -1;
        if (ownerId >= 0 && world.tribes && world.tribes[ownerId]) {
          let tint = null;
          if (view === 'communities') {
            tint = tribeRgb[ownerId];
          } else {
            const era = tribeEra(world.tribes[ownerId]);
            tint = hexToRgb(ERA_COLORS[era]);
          }
          if (tint) {
            const a = 0.2 + world.influenceStrength[i] * 0.45;
            r = r * (1 - a) + tint[0] * a;
            g = g * (1 - a) + tint[1] * a;
            b = b * (1 - a) + tint[2] * a;
          }
        }
      } else {
        // satellite
        [r, g, b] = satelliteColor(world, x, y, i);
      }

      // Fill the TILE_PX x TILE_PX block
      for (let py = 0; py < TILE_PX; py++) {
        let p = ((y * TILE_PX + py) * worldPx + x * TILE_PX) * 4;
        for (let px = 0; px < TILE_PX; px++) {
          data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
          p += 4;
        }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  baseLayer.key = `${world.seed}|${view}`;
  return canvas;
}

// --- Frame ----------------------------------------------------------------

function renderWorld(world, canvas, view = 'satellite', camera = null, rebuildBase = true) {
  camera = clampCamera(world, camera || createCamera());

  const key = `${world.seed}|${view}`;
  if (rebuildBase || baseLayer.key !== key) buildBaseLayer(world, view);

  // Only resize when needed — assigning width clears and reallocates.
  if (canvas.width !== VIEW_PX || canvas.height !== VIEW_PX) {
    canvas.width = VIEW_PX;
    canvas.height = VIEW_PX;
  }
  const ctx = canvas.getContext('2d');
  const t = cameraTransform(world, camera);

  // Tiles are meant to look like tiles — no smoothing when magnified.
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(baseLayer.canvas,
    t.srcX, t.srcY, t.srcSize, t.srcSize,
    0, 0, VIEW_PX, VIEW_PX);
  ctx.imageSmoothingEnabled = true;

  const toScreenX = (tileX) => ((tileX + 0.5) * TILE_PX - t.srcX) * t.scale;
  const toScreenY = (tileY) => ((tileY + 0.5) * TILE_PX - t.srcY) * t.scale;

  // Visible tile window, with a margin so markers straddling the edge
  // still get drawn.
  const left = t.srcX / TILE_PX - 1;
  const top = t.srcY / TILE_PX - 1;
  const right = (t.srcX + t.srcSize) / TILE_PX + 1;
  const bottom = (t.srcY + t.srcSize) / TILE_PX + 1;
  const visible = (x, y) => x >= left && x <= right && y >= top && y <= bottom;

  const resourceView = view === 'minerals' || view === 'natural';

  // Resource markers: all of them on the satellite view, a single filtered
  // category (drawn larger, with an outline) on the resource views. They
  // mark individual tiles, so they scale with the tiles.
  if (view === 'satellite' || resourceView) {
    const filter = view === 'minerals' ? 'mineral'
      : view === 'natural' ? 'natural' : null;
    const radius = (resourceView ? TILE_PX * 0.75 : TILE_PX * 0.42) * t.scale;
    const { size } = world;

    for (let y = Math.max(0, Math.floor(top)); y < Math.min(size, bottom); y++) {
      for (let x = Math.max(0, Math.floor(left)); x < Math.min(size, right); x++) {
        const res = world.resources[y * size + x];
        if (!res) continue;
        if (filter && res.category !== filter) continue;
        ctx.fillStyle = res.color;
        ctx.beginPath();
        ctx.arc(toScreenX(x), toScreenY(y), radius, 0, Math.PI * 2);
        ctx.fill();
        if (resourceView) {
          ctx.strokeStyle = 'rgba(0,0,0,0.6)';
          ctx.lineWidth = Math.max(0.8, 0.8 * t.scale);
          ctx.stroke();
        }
      }
    }
  }

  // Settlements (places) and bands (nomadic presences) are drawn on the
  // satellite, communities and development views, coloured by the tribe
  // they answer to. Settled markers are solid and scale with population;
  // bands are small open rings — people passing through, not places.
  const peopleView = view === 'satellite' || view === 'communities' || view === 'development';
  if (peopleView && (world.settlements || world.bands)) {
    const markerScale = Math.sqrt(camera.zoom);
    const markerRadius = (pop) => (2.5 + Math.sqrt(pop) / 5) * markerScale;

    for (const s of world.settlements || []) {
      const tribe = world.tribes[s.tribeId];
      if (!tribe || !tribe.alive || !visible(s.x, s.y)) continue;
      ctx.fillStyle = tribe.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(toScreenX(s.x), toScreenY(s.y),
        Math.min(14 * markerScale, markerRadius(s.pop)), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    for (const band of world.bands || []) {
      const tribe = world.tribes[band.tribeId];
      if (!tribe || !tribe.alive || !visible(band.x, band.y)) continue;
      ctx.strokeStyle = tribe.color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(toScreenX(band.x), toScreenY(band.y), 2.2 * markerScale, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Labels keep a constant size on screen, the way a map's do.
    const label = (text, screenX, screenY, font) => {
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText(text, screenX, screenY);
      ctx.fillStyle = '#fff';
      ctx.fillText(text, screenX, screenY);
    };

    if (view === 'communities' || view === 'development') {
      for (const tribe of world.tribes) {
        if (!tribe.alive) continue;
        // Settled peoples are labelled at their chief settlement; nomads
        // at their largest band.
        let anchor = tribeChiefSettlement(world, tribe);
        if (!anchor) {
          for (const band of world.bands || []) {
            if (band.tribeId === tribe.id && (!anchor || band.pop > anchor.pop)) {
              anchor = band;
            }
          }
        }
        if (!anchor || !visible(anchor.x, anchor.y)) continue;
        const radius = markerRadius(anchor.pop);
        label(tribe.name, toScreenX(anchor.x), toScreenY(anchor.y) - radius - 5,
          'bold 12px system-ui, sans-serif');
      }
    }

    // Zoomed in far enough to read the map in detail: name the places
    // themselves, which is the point of having settlements as entities.
    if (camera.zoom >= 2.5) {
      for (const s of world.settlements || []) {
        const tribe = world.tribes[s.tribeId];
        if (!tribe || !tribe.alive || !visible(s.x, s.y)) continue;
        const radius = Math.min(14 * markerScale, markerRadius(s.pop));
        label(s.name, toScreenX(s.x), toScreenY(s.y) + radius + 12,
          '11px system-ui, sans-serif');
      }
    }
  }
}

// ---- js/main.js ----
// App entry point: wires the UI to world generation and rendering.

(function () {
  const canvas = document.getElementById('map-canvas');
  const seedInput = document.getElementById('seed-input');
  const generateBtn = document.getElementById('generate-btn');
  const randomBtn = document.getElementById('random-btn');
  const viewSelect = document.getElementById('view-select');
  const tileInfo = document.getElementById('tile-info');
  const terrainLegend = document.getElementById('terrain-legend');
  const resourceLegend = document.getElementById('resource-legend');
  const legendATitle = document.getElementById('legend-a-title');
  const legendBTitle = document.getElementById('legend-b-title');
  const statsEl = document.getElementById('stats');
  const simulateBtn = document.getElementById('simulate-btn');
  const tribesSection = document.getElementById('tribes-section');
  const tribesPanel = document.getElementById('tribes-panel');
  const eventsLog = document.getElementById('events-log');
  const zoomInBtn = document.getElementById('zoom-in-btn');
  const zoomOutBtn = document.getElementById('zoom-out-btn');
  const zoomResetBtn = document.getElementById('zoom-reset-btn');
  const zoomLevelEl = document.getElementById('zoom-level');

  const tribeInspector = document.getElementById('tribe-inspector');

  let world = null;
  let camera = createCamera();
  let selectedTribeId = null;

  function formatPop(n) {
    n = Math.round(n);
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
    return n.toLocaleString();
  }

  function generate(seed) {
    const t0 = performance.now();
    world = createWorld(seed);
    const ms = performance.now() - t0;
    seedInput.value = seed;
    simulateBtn.textContent = 'Found tribes & simulate 10 years';
    tribesSection.style.display = 'none';
    selectedTribeId = null;
    if (viewSelect.value === 'communities' || viewSelect.value === 'development') {
      viewSelect.value = 'satellite';
    }
    camera = createCamera();
    refreshView();
    renderStats(ms);
  }

  function simulate() {
    const firstRun = !world.tribes;
    if (firstRun) foundTribes(world);
    simulateYears(world, 10);
    simulateBtn.textContent = 'Simulate 10 more years';
    tribesSection.style.display = '';
    if (firstRun) viewSelect.value = 'communities';
    refreshView();
    renderStats();
    renderTribes();
    renderEvents();
  }

  function renderTribes() {
    tribesPanel.innerHTML = world.tribes
      .slice()
      .sort((a, b) => totalTribePop(world, b) - totalTribePop(world, a))
      .map((t) => {
        const pop = totalTribePop(world, t);
        const posture = computePosture(t.traits);
        const nomadic = tribeIsNomadic(world, t);
        const places = nomadic
          ? `${tribeBands(world, t.id).length} bands`
          : `${tribeSettlements(world, t.id).length} settlement${tribeSettlements(world, t.id).length > 1 ? 's' : ''}`;
        const meta = t.alive
          ? `${formatPop(pop)} people<br>${places}`
          : 'died out';
        const badge = t.alive
          ? `<span class="badge">${ERA_LABELS[tribeEra(t)]}</span> ${dominantPostureGlyph(posture)}`
          : '';
        return `<div class="tribe-row${t.alive ? '' : ' dead'}${t.id === selectedTribeId ? ' selected' : ''}" data-tribe="${t.id}">` +
          `<span class="swatch" style="background: ${t.color}"></span>` +
          `<span>${t.name}</span> ${badge}` +
          `<span class="tribe-meta">${meta}</span></div>`;
      })
      .join('');

    for (const row of tribesPanel.querySelectorAll('.tribe-row')) {
      row.addEventListener('click', () => {
        const id = Number(row.dataset.tribe);
        selectedTribeId = selectedTribeId === id ? null : id;
        renderTribes();
        renderInspector();
      });
    }
    renderInspector();
  }

  function renderInspector() {
    if (selectedTribeId === null || !world.tribes || !world.tribes[selectedTribeId]) {
      tribeInspector.style.display = 'none';
      return;
    }
    const t = world.tribes[selectedTribeId];
    const p = t.progress;
    const posture = computePosture(t.traits);
    const era = ERA_LABELS[tribeEra(t)];
    const arch = t.archetype === 'random' ? 'A people of their own kind'
      : `${ARCHETYPES[t.archetype].label} archetype`;

    const traitRows = TRAIT_KEYS.map((key) =>
      `<div class="trait-row"><span class="trait-name">${TRAIT_LABELS[key]}</span>` +
      `<span class="trait-bar"><div style="width:${(t.traits[key] * 100).toFixed(0)}%; background:${t.color}"></div></span></div>`
    ).join('');

    const techNames = [...p.techs].filter((id) => TECHS[id])
      .map((id) => TECHS[id].name);
    const target = p.target && TECHS[p.target] ? TECHS[p.target].name : '—';

    const relations = Object.entries(world.relations || {})
      .filter(([key]) => key.split('-').map(Number).includes(t.id))
      .map(([key, rel]) => {
        const otherId = key.split('-').map(Number).find((id) => id !== t.id);
        const other = world.tribes[otherId];
        return other && other.alive ? `${other.name}: ${rel.stance}` : null;
      })
      .filter(Boolean);

    tribeInspector.style.display = '';
    tribeInspector.innerHTML =
      `<h3 style="color:${t.color}">${t.name}${t.alive ? '' : ' †'}</h3>` +
      `<div class="insp-sub">${arch} · ${era} · ${GOVERNANCE_LABELS[p.governance]}</div>` +
      `<div class="posture-row">` +
      `<span>⚔ ${(posture.military * 100).toFixed(0)}%</span>` +
      `<span>⚖ ${(posture.trade * 100).toFixed(0)}%</span>` +
      `<span>📜 ${(posture.learning * 100).toFixed(0)}%</span></div>` +
      traitRows +
      `<div class="insp-section"><strong>Technologies:</strong> ${techNames.join(', ') || 'none'}</div>` +
      `<div class="insp-section"><strong>Researching:</strong> ${target}</div>` +
      `<div class="insp-section"><strong>Art:</strong> ${ART_STAGES[p.artStage]} · ` +
      `<strong>Philosophy:</strong> ${PHIL_STAGES[p.philStage]}</div>` +
      (relations.length
        ? `<div class="insp-section"><strong>Relations:</strong> ${relations.join(' · ')}</div>`
        : '');
  }

  function renderEvents() {
    eventsLog.innerHTML = world.events
      .slice(-60)
      .reverse()
      .map((e) => `<div><span class="ev-year">Yr ${e.year}</span> ${e.text}</div>`)
      .join('');
  }

  // Full refresh: repaints the tile layer too (world or simulation changed).
  function refreshView() {
    const view = viewSelect.value;
    renderWorld(world, canvas, view, camera, true);
    renderLegends(view);
    updateZoomUI();
  }

  // Cheap refresh for panning and zooming: reuses the cached tile layer.
  function redraw() {
    renderWorld(world, canvas, viewSelect.value, camera, false);
    updateZoomUI();
  }

  function updateZoomUI() {
    zoomLevelEl.textContent = `${camera.zoom.toFixed(1)}×`;
    zoomOutBtn.disabled = camera.zoom <= MIN_ZOOM;
    zoomInBtn.disabled = camera.zoom >= MAX_ZOOM;
    canvas.classList.toggle('zoomed', camera.zoom > MIN_ZOOM);
  }

  // Zoom about a fixed point on screen (the cursor, or the view centre),
  // so whatever you're looking at stays put.
  function zoomBy(factor, anchorScreen) {
    const before = anchorScreen
      ? screenToTile(world, camera, anchorScreen.x, anchorScreen.y)
      : null;
    camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom * factor));
    clampCamera(world, camera);
    if (before) {
      const after = screenToTile(world, camera, anchorScreen.x, anchorScreen.y);
      camera.cx += before.x - after.x;
      camera.cy += before.y - after.y;
      clampCamera(world, camera);
    }
    redraw();
  }

  // Pointer position in canvas pixels (the canvas is scaled by CSS).
  function canvasPoint(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left) * (canvas.width / rect.width),
      y: (ev.clientY - rect.top) * (canvas.height / rect.height),
    };
  }

  function terrainSwatchRows() {
    return Object.entries(TERRAIN_LABELS).map(([type, label]) => {
      const [r, g, b] = TERRAIN_COLORS[type];
      return `<div class="legend-row">` +
        `<span class="swatch" style="background: rgb(${r},${g},${b})"></span>` +
        `<span>${label}</span></div>`;
    }).join('');
  }

  function resourceSwatchRows(category) {
    return Object.values(RESOURCES)
      .filter((res) => !category || res.category === category)
      .map((res) =>
        `<div class="legend-row">` +
        `<span class="swatch" style="background: ${res.color}; border-radius: 50%"></span>` +
        `<span>${res.name}</span></div>`)
      .join('');
  }

  function rampLegend(stops, minLabel, maxLabel) {
    const colors = stops.map(([r, g, b]) => `rgb(${r},${g},${b})`).join(', ');
    return `<div class="ramp-bar" style="background: linear-gradient(to right, ${colors})"></div>` +
      `<div class="ramp-labels"><span>${minLabel}</span><span>${maxLabel}</span></div>`;
  }

  // The two sidebar legend sections adapt to the active view.
  function renderLegends(view) {
    if (view === 'rainfall') {
      legendATitle.textContent = 'Avg annual rainfall';
      terrainLegend.innerHTML = rampLegend(RAINFALL_RAMP,
        `${RAINFALL_RANGE.min} mm`, `${RAINFALL_RANGE.max} mm`);
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else if (view === 'temperature') {
      legendATitle.textContent = 'Avg annual temperature';
      terrainLegend.innerHTML = rampLegend(TEMPERATURE_RAMP,
        `${TEMPERATURE_RANGE.min}°C`, `${TEMPERATURE_RANGE.max}°C`);
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else if (view === 'natural') {
      legendATitle.textContent = 'Natural resources';
      terrainLegend.innerHTML = resourceSwatchRows('natural');
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else if (view === 'minerals') {
      legendATitle.textContent = 'Mineral resources';
      terrainLegend.innerHTML = resourceSwatchRows('mineral');
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else if (view === 'communities') {
      legendATitle.textContent = 'Communities';
      terrainLegend.innerHTML = world.tribes
        ? world.tribes.map((t) =>
            `<div class="legend-row${t.alive ? '' : '" style="opacity:0.45'}">` +
            `<span class="swatch" style="background: ${t.color}"></span>` +
            `<span>${t.name}</span></div>`).join('')
        : '<div class="legend-row">No tribes yet — press the simulate button.</div>';
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else if (view === 'development') {
      legendATitle.textContent = 'Development (era)';
      terrainLegend.innerHTML = ERAS.map((era) =>
        `<div class="legend-row">` +
        `<span class="swatch" style="background: ${ERA_COLORS[era]}"></span>` +
        `<span>${ERA_LABELS[era]}</span></div>`).join('');
      legendBTitle.textContent = '';
      resourceLegend.innerHTML = '';
    } else {
      // satellite / elevation
      legendATitle.textContent = 'Terrain';
      terrainLegend.innerHTML = terrainSwatchRows();
      legendBTitle.textContent = 'Resources';
      resourceLegend.innerHTML = resourceSwatchRows();
    }
  }

  function renderStats(genMs) {
    const s = world.stats;
    const rows = [];
    if (world.tribes) {
      rows.push(['Year', world.year]);
      const alive = world.tribes.filter((t) => t.alive);
      const totalPop = alive.reduce((sum, t) => sum + totalTribePop(world, t), 0);
      rows.push(['Tribes', `${alive.length} of ${world.tribes.length}`]);
      if (world.bands.length) rows.push(['Nomad bands', world.bands.length]);
      if (world.settlements.length) rows.push(['Settlements', world.settlements.length]);
      rows.push(['Population', formatPop(totalPop)]);
    }
    rows.push(['Land area', `${s.landAreaKm2.toLocaleString()} km²`]);
    rows.push(['Land cover', `${s.landPercent.toFixed(1)}%`]);
    const riverTiles = s.terrainCounts[TERRAIN.RIVER] || 0;
    rows.push(['River tiles', riverTiles.toLocaleString()]);
    const resTotal = Object.values(s.resourceCounts).reduce((a, b) => a + b, 0);
    rows.push(['Resource sites', resTotal.toLocaleString()]);
    if (genMs !== undefined) rows.push(['Generated in', `${genMs.toFixed(0)} ms`]);

    statsEl.innerHTML = rows
      .map(([k, v]) => `<div class="stat-row"><span>${k}</span><span class="value">${v}</span></div>`)
      .join('');
  }

  function describeTile(tile) {
    if (!tile) return 'Hover over the map to inspect a tile.';
    const parts = [];
    parts.push(`<strong>${TERRAIN_LABELS[tile.terrain]}</strong> at (${tile.x}, ${tile.y})`);
    const meters = elevationToMeters(tile.elevation);
    if (meters >= 0) parts.push(`Elevation ≈ ${meters} m`);
    parts.push(`Rainfall ≈ ${moistureToRainfallMm(tile.moisture).toLocaleString()} mm/yr`);
    parts.push(`Avg temp ≈ ${tile.temperature.toFixed(1)}°C`);
    if (tile.resource) parts.push(`Resource: <strong>${tile.resource.name}</strong>`);
    const settlement = world.tribes ? settlementAt(world, tile.x, tile.y) : null;
    if (settlement) {
      const tribe = world.tribes[settlement.tribeId];
      parts.push(`<strong>${settlement.name}</strong> — ${formatPop(settlement.pop)} people` +
        (tribe ? ` of ${tribe.name}` : '') +
        ` (founded Yr ${settlement.foundedYear})`);
    } else if (world.tribes) {
      const band = bandAt(world, tile.x, tile.y);
      if (band) {
        const tribe = world.tribes[band.tribeId];
        parts.push(`A wandering band of <strong>${tribe ? tribe.name : '?'}</strong> — ` +
          `${Math.round(band.pop)} people`);
      }
    }
    if (world.influenceOwner) {
      const ownerId = world.influenceOwner[tile.y * world.size + tile.x];
      if (ownerId >= 0 && world.tribes[ownerId]) {
        parts.push(`Territory of <strong>${world.tribes[ownerId].name}</strong>`);
      }
    }
    return parts.join('<br>');
  }

  let panning = null;

  canvas.addEventListener('mousemove', (ev) => {
    if (!world) return;
    const p = canvasPoint(ev);

    if (panning) {
      const pxPerTile = screenPxPerTile(world, camera);
      camera.cx = panning.camX + (panning.x - p.x) / pxPerTile;
      camera.cy = panning.camY + (panning.y - p.y) / pxPerTile;
      clampCamera(world, camera);
      redraw();
      return;
    }

    const t = screenToTile(world, camera, p.x, p.y);
    tileInfo.innerHTML = describeTile(tileAt(world, Math.floor(t.x), Math.floor(t.y)));
  });

  canvas.addEventListener('mousedown', (ev) => {
    if (!world || camera.zoom <= MIN_ZOOM) return;
    const p = canvasPoint(ev);
    panning = { x: p.x, y: p.y, camX: camera.cx, camY: camera.cy };
    canvas.classList.add('panning');
    ev.preventDefault();
  });

  window.addEventListener('mouseup', () => {
    panning = null;
    canvas.classList.remove('panning');
  });

  canvas.addEventListener('wheel', (ev) => {
    if (!world) return;
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.2 : 1 / 1.2;
    zoomBy(factor, canvasPoint(ev));
  }, { passive: false });

  canvas.addEventListener('mouseleave', () => {
    tileInfo.textContent = 'Hover over the map to inspect a tile.';
  });

  zoomInBtn.addEventListener('click', () => zoomBy(1.5));
  zoomOutBtn.addEventListener('click', () => zoomBy(1 / 1.5));
  zoomResetBtn.addEventListener('click', () => {
    camera = createCamera();
    redraw();
  });

  generateBtn.addEventListener('click', () => {
    const seed = seedInput.value.trim() || randomSeedString();
    generate(seed);
  });

  randomBtn.addEventListener('click', () => generate(randomSeedString()));

  simulateBtn.addEventListener('click', () => {
    if (world) simulate();
  });

  seedInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') generateBtn.click();
  });

  viewSelect.addEventListener('change', () => {
    if (world) refreshView();
  });

  generate(randomSeedString());
})();
</script>
</body>
</html>
