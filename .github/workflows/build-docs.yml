name: Build docs

# Rebuild the GitHub Pages bundle in /docs on every push. If the built
# output changed, the workflow commits it back to the same branch.
on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs/index.html
        run: node build.js

      - name: Commit rebuilt docs
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs [skip ci]"
          git push
